<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Concept</title>
<style>
@font-face{font-family:BarlowC;src:url(FONTS/BarlowCondensed-700.woff2);font-weight:700}
@font-face{font-family:BarlowC;src:url(FONTS/BarlowCondensed-800.woff2);font-weight:800}
@font-face{font-family:Barlow;src:url(FONTS/Barlow-400.woff2);font-weight:400}
@font-face{font-family:Barlow;src:url(FONTS/Barlow-500.woff2);font-weight:500}
@font-face{font-family:Barlow;src:url(FONTS/Barlow-700.woff2);font-weight:700}
@font-face{font-family:Newsreader;src:url(FONTS/SOL-Newsreader-var.woff2);font-weight:200 800}
@font-face{font-family:Newsreader;src:url(FONTS/SOL-Newsreader-var-italic.woff2);font-weight:200 800;font-style:italic}
@font-face{font-family:Figtree;src:url(FONTS/Figtree-var.woff2);font-weight:300 900}
@font-face{font-family:Cormorant;src:url(FONTS/VS-Cormorant-var.woff2);font-weight:300 700}
@font-face{font-family:Cormorant;src:url(FONTS/VS-Cormorant-italic-var.woff2);font-weight:300 700;font-style:italic}
@font-face{font-family:Jost;src:url(FONTS/VS-Jost-var.woff2);font-weight:300 800}
@font-face{font-family:Jakarta;src:url(FONTS/PlusJakarta-400.woff2);font-weight:400}
@font-face{font-family:Jakarta;src:url(FONTS/PlusJakarta-600.woff2);font-weight:600}
@font-face{font-family:Jakarta;src:url(FONTS/PlusJakarta-800.woff2);font-weight:800}
@font-face{font-family:Bricolage;src:url(FONTS/Bricolage-var.woff2);font-weight:300 800}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 40px}
.concept{background:#16131a;color:#e9e6ef;font:500 12.5px/1 Figtree,sans-serif;text-align:center;padding:11px 16px;letter-spacing:.01em}
.concept b{color:#fff;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:16px 26px;border-radius:var(--r-btn);white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn-a{background:var(--accent);color:var(--on-accent);box-shadow:0 10px 26px -10px var(--accent)}
.btn-o{border:1.5px solid var(--line);color:var(--ink);background:var(--btn-o-bg)}
.stars{color:#f5b301;letter-spacing:2px;font-size:15px}
nav.top{height:84px;display:flex;align-items:center}
nav.top .wrap{display:flex;align-items:center;gap:30px;width:100%}
.logo{display:flex;align-items:center;gap:12px;flex-shrink:0;max-width:340px}
.logo img{max-height:54px;max-width:230px;object-fit:contain}
.logo .chip{background:#fff;border-radius:10px;padding:6px 10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.logo .chip.dk{background:#16131a}
.logo .word{font-family:var(--fh);font-weight:var(--wm-w);font-size:25px;line-height:1.02;letter-spacing:var(--wm-ls);text-transform:var(--wm-tt)}
.logo .word small{display:block;font-family:var(--fb);font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.65;margin-top:5px}
.links{display:flex;gap:28px;margin-left:auto;font-weight:500;font-size:15.5px;opacity:.92}
.navphone{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.navphone svg{width:17px;height:17px}
.nav-cta{padding:13px 22px;font-size:15px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--eyebrow)}
.eyebrow:before{content:"";width:28px;height:2px;background:currentColor}
h1{font-family:var(--fh);font-weight:var(--h-w);letter-spacing:var(--h-ls);line-height:var(--h-lh);text-transform:var(--h-tt);font-size:var(--h-size)}
h1 em{font-style:var(--em-style);color:var(--em-color);font-weight:var(--em-w)}
.sub{font-size:19px;line-height:1.6;color:var(--muted);max-width:560px}
.cta-row{display:flex;gap:14px;flex-wrap:wrap}
.card{background:var(--card);border-radius:18px;box-shadow:0 18px 50px -18px rgba(20,16,30,.35)}
.quote{padding:20px 22px;max-width:330px}
.quote p{font-family:var(--fq);font-size:var(--q-size);line-height:1.4;color:var(--card-ink);margin:8px 0 10px}
.quote .who{font-size:13px;color:var(--card-muted);font-weight:600}
.rating{display:flex;align-items:center;gap:14px;padding:14px 18px}
.rating .num{font-family:var(--fh);font-size:34px;font-weight:800;line-height:1;color:var(--card-ink)}
.rating .lbl{font-size:13px;color:var(--card-muted);font-weight:600;line-height:1.3}
.g{width:22px;height:22px;flex-shrink:0}
.facts{display:flex;gap:12px;flex-wrap:wrap}
.fact{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:var(--fact-bg);border:1px solid var(--fact-line)}
.fact svg{width:22px;height:22px;color:var(--accent-2)}
.fact b{display:block;font-size:14.5px;line-height:1.25}
.fact span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3}
.photo{background:#ccc center/cover no-repeat}
.nophoto{background:linear-gradient(140deg,var(--accent) 0%,var(--dark) 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.nophoto span{font-family:var(--fh);font-weight:800;font-size:200px;color:rgba(255,255,255,.14);letter-spacing:-.04em}
.mbar{display:none}

/* ---------- BOLD (trades / auto) */
.a-bold .head{background:var(--dark);color:#fff}
.a-bold .hero{position:relative;min-height:782px;color:#fff;display:flex;align-items:center;overflow:hidden;background:var(--dark)}
.a-bold .hero .bg{position:absolute;top:0;right:0;bottom:0;width:50%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%)}
.a-bold .hero .bg .photo{position:absolute;inset:0}
.a-bold .hero .bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 40%)}
.a-bold .stripe{position:absolute;top:0;bottom:0;right:50%;width:120px;transform:translateX(61px) skewX(-8.6deg);background:linear-gradient(90deg,transparent 0 98px,var(--accent) 98px 112px,transparent 112px)}
.a-bold .hero .wrap{position:relative;width:100%}
.a-bold .hero .txt{max-width:640px;display:flex;flex-direction:column;gap:26px}
.a-bold .sub{color:rgba(255,255,255,.78)}
.a-bold .btn-o{border-color:rgba(255,255,255,.35);color:#fff;background:rgba(255,255,255,.04)}
.a-bold .fact{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.a-bold .fact span{color:rgba(255,255,255,.65)}
.a-bold .hero .quote{position:absolute;left:47%;bottom:56px}
.a-bold .hero .rating{position:absolute;left:52%;top:60px}
.a-bold nav.top{color:#fff}

/* ---------- EDITORIAL (food & drink) */
.a-edit{--line:rgba(255,255,255,.28)}
.a-edit .hero{min-height:782px;display:flex;align-items:center;padding:20px 0 50px}
.a-edit .hero .wrap{display:grid;grid-template-columns:1.02fr 1fr;gap:56px;align-items:center;width:100%}
.a-edit .txt{display:flex;flex-direction:column;gap:26px}
.a-edit .mosaic{position:relative;height:640px}
.a-edit .mosaic .p1{position:absolute;right:0;top:0;width:66%;height:78%;border-radius:200px 200px 22px 22px}
.a-edit .mosaic .p2{position:absolute;left:0;bottom:0;width:46%;height:52%;border-radius:22px;border:8px solid var(--bg)}
.a-edit .mosaic .rating{position:absolute;left:-6%;top:8%}
.a-edit .mosaic .quote{position:absolute;left:40%;bottom:-6px;max-width:300px}
.a-edit .loves{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.a-edit .loves b{color:var(--ink);font-weight:600;margin-right:4px}
.a-edit .loves span{border:1px solid var(--fact-line);padding:6px 12px;border-radius:99px;color:var(--ink)}

/* ---------- SOFT (beauty / pets / wellness) */
.a-soft .hero{min-height:782px;display:flex;align-items:center;padding:10px 0 40px;position:relative;overflow:hidden}
.a-soft .hero:before{content:"";position:absolute;right:-180px;top:-120px;width:760px;height:760px;border-radius:50%;background:var(--blob)}
.a-soft .hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center;width:100%;position:relative}
.a-soft .txt{display:flex;flex-direction:column;gap:26px}
.a-soft .art{position:relative;height:640px}
.a-soft .art .p1{position:absolute;left:12%;top:0;width:68%;height:86%;border-radius:300px 300px 26px 26px;box-shadow:0 30px 60px -30px rgba(40,20,40,.5)}
.a-soft .art .p2{position:absolute;left:0;bottom:2%;width:190px;height:190px;border-radius:50%;border:8px solid var(--bg)}
.a-soft .art .quote{position:absolute;left:30%;bottom:2%;max-width:290px}
.a-soft .art .rating{position:absolute;left:-2%;top:10%}

/* ---------- CLEAN (professional / medical / real estate) */
.a-clean nav.top{border-bottom:1px solid var(--fact-line)}
.a-clean .hero{min-height:782px;display:flex;align-items:center;padding:30px 0 50px;background:radial-gradient(1200px 600px at 85% 20%,var(--blob),transparent 60%)}
.a-clean .hero .wrap{display:grid;grid-template-columns:1.08fr 1fr;gap:64px;align-items:center;width:100%}
.a-clean .txt{display:flex;flex-direction:column;gap:26px}
.a-clean .art{position:relative;height:600px}
.a-clean .art .p1{position:absolute;inset:0 0 40px 40px;border-radius:28px}
.a-clean .art .panel{position:absolute;inset:0 0 40px 40px;border-radius:28px;background:linear-gradient(140deg,var(--accent) 0%,var(--dark) 100%);display:flex;align-items:center;justify-content:center;overflow:hidden}
.a-clean .art .panel .mono{font-family:var(--fh);font-weight:800;font-size:220px;color:rgba(255,255,255,.12);letter-spacing:-.04em}
.a-clean .art .info{position:absolute;left:0;bottom:0;padding:20px 22px;width:330px}
.a-clean .art .info h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--card-muted);margin-bottom:10px}
.a-clean .art .info div{display:flex;justify-content:space-between;font-size:14.5px;padding:5px 0;color:var(--card-ink);border-bottom:1px dashed rgba(0,0,0,.08)}
.a-clean .art .info div:last-child{border:0}
.a-clean .art .rating{position:absolute;left:0;top:36px}

/* ---------- FRESH (outdoor home services) */
.a-fresh .hero{min-height:782px;display:flex;align-items:center;padding:20px 0 50px;background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
.a-fresh .hero .wrap{display:grid;grid-template-columns:1fr 1.02fr;gap:56px;align-items:center;width:100%}
.a-fresh .txt{display:flex;flex-direction:column;gap:26px}
.a-fresh .art{position:relative;height:640px}
.a-fresh .art .p1{position:absolute;right:0;top:0;width:88%;height:74%;border-radius:30px}
.a-fresh .art .form{position:absolute;left:0;bottom:0;width:360px;padding:24px}
.a-fresh .form h4{font-family:var(--fh);font-size:22px;color:var(--card-ink);margin-bottom:4px}
.a-fresh .form p{font-size:13.5px;color:var(--card-muted);margin-bottom:14px}
.a-fresh .form .in{border:1.5px solid #e3e6e8;border-radius:11px;padding:11px 13px;font-size:14px;color:#8a9096;margin-bottom:9px;display:flex;justify-content:space-between}
.a-fresh .form .btn{width:100%;justify-content:center;margin-top:4px;padding:14px}
.a-fresh .art .rating{position:absolute;left:44%;top:24px}

/* ---------- below the fold (shared) */
section.blk{padding:96px 0}
.blk h2{font-family:var(--fh);font-weight:var(--h-w);font-size:52px;line-height:1.05;letter-spacing:var(--h-ls);text-transform:var(--h-tt);margin:14px 0 18px}
.reviews{background:var(--rev-bg);color:var(--rev-ink)}
.reviews .top{display:flex;justify-content:space-between;align-items:end;gap:40px;margin-bottom:44px}
.reviews .big{display:flex;align-items:center;gap:18px}
.reviews .big .num{font-family:var(--fh);font-size:64px;font-weight:800;line-height:1}
.reviews .big .lbl{font-size:15px;opacity:.8}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rcard{background:var(--rcard);color:var(--rcard-ink);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px}
.rcard p{font-size:16.5px;line-height:1.6}
.rcard .who{display:flex;align-items:center;gap:12px;margin-top:auto;font-weight:700;font-size:15px}
.rcard .who i{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.rcard .who small{display:block;font-weight:500;opacity:.6;font-size:12.5px}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
.svc div{border:1px solid var(--fact-line);border-radius:18px;padding:26px;background:var(--fact-bg)}
.svc b{font-family:var(--fh);font-size:22px;display:block;margin-bottom:6px;font-weight:700}
.svc span{color:var(--muted);font-size:15px}
footer{background:var(--dark);color:rgba(255,255,255,.85);padding:56px 0;font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:30px}
footer b{color:#fff;font-family:var(--fh);font-size:22px}

/* ---------- phone */
@media (max-width:700px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  .concept{font-size:11.5px;line-height:1.4;padding:9px 14px}
  nav.top{height:68px}
  nav.top .wrap{gap:12px}
  .links,.navphone{display:none}
  .nav-cta{margin-left:auto;padding:11px 16px;font-size:14px}
  .logo{max-width:58%}
  .logo img{max-height:42px;max-width:170px}
  .logo .word{font-size:19px}
  .logo .word small{font-size:9.5px}
  h1{font-size:var(--h-size-m)!important}
  .sub{font-size:16.5px}
  .btn{padding:15px 20px;font-size:15.5px}
  .cta-row .btn{flex:1;justify-content:center}
  .cta-row .btn-o{display:none}
  .facts .fact:nth-child(n+3){display:none}
  .hero{min-height:0!important;padding:30px 0 130px!important}
  .hero .wrap{display:flex!important;flex-direction:column;gap:30px!important;align-items:stretch!important}
  .hero .txt{gap:22px!important}
  .a-bold .hero .bg,.a-bold .stripe,.a-bold .hero .quote,.a-bold .hero .rating{display:none}
  .mosaic,.art{height:340px!important}
  .a-edit .mosaic .p2,.a-edit .mosaic .quote,.art .quote,.art .p2,.a-fresh .art .form,.a-clean .art .info{display:none}
  .a-edit .mosaic .p1{width:100%;height:100%;border-radius:160px 160px 20px 20px}
  .a-soft .art .p1{left:0;width:100%;height:100%}
  .a-clean .art .p1,.a-clean .art .panel{inset:0}
  .a-fresh .art .p1{width:100%;height:100%}
  .art .rating,.mosaic .rating{left:12px!important;right:auto!important;top:auto!important;bottom:12px!important}
  .a-edit .loves{display:none}
  .facts{gap:8px}
  .fact{padding:10px 12px}
  .mbar{display:flex;position:fixed;left:12px;right:12px;bottom:14px;gap:8px;padding:8px;border-radius:20px;background:var(--dark);z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.35)}
  .mbar a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;font-weight:700;font-size:15.5px;color:#fff;background:rgba(255,255,255,.12)}
  .mbar a.p{background:var(--accent);color:var(--on-accent)}
  .mbar svg{width:18px;height:18px}
  .rgrid,.svc{grid-template-columns:1fr}
  .reviews .top{flex-direction:column;align-items:start}
  .blk h2{font-size:36px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = __DATA__;
const I = {
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 6.5V12l3.5 2"/></svg>',
  star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>',
  g: '<svg class="g" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>',
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const em = (s) => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const ph = (cls, src, pos) => src ? `<div class="photo ${cls}" style="background-image:url('${src}');background-position:${pos || 'center'}"></div>`
  : (cls === 'p1' ? `<div class="photo p1 nophoto"><span>${esc(D.mono)}</span></div>` : '');
const stars = (n) => '★★★★★'.slice(0, Math.round(n || 5));
const logo = () => D.logo
  ? `<a class="logo">${D.logo_chip ? `<span class="chip${D.logo_chip === 'dark' ? ' dk' : ''}"><img src="${D.logo}" alt=""></span>` : `<img src="${D.logo}" alt="">`}</a>`
  : `<a class="logo"><span class="word">${esc(D.wordmark)}${D.wordmark_sub ? `<small>${esc(D.wordmark_sub)}</small>` : ''}</span></a>`;
const nav = () => `<nav class="top"><div class="wrap">${logo()}
  <div class="links">${D.links.map((l) => `<a>${esc(l)}</a>`).join('')}</div>
  ${D.phone ? `<a class="navphone">${I.phone}${esc(D.phone)}</a>` : ''}
  <a class="btn btn-a nav-cta">${esc(D.cta_short)}</a></div></nav>`;
const ratingCard = () => D.rating && D.reviews >= 5 ? `<div class="card rating">${I.g}<div><div style="display:flex;align-items:center;gap:8px"><span class="num">${D.rating.toFixed(1)}</span><span class="stars">${stars(D.rating)}</span></div><div class="lbl">${D.reviews.toLocaleString()} Google reviews</div></div></div>` : '';
const quoteCard = () => D.quote ? `<div class="card quote"><span class="stars">★★★★★</span><p>“${esc(D.quote.text)}”</p><div class="who">${esc(D.quote.who)} · Google review</div></div>` : '';
const ctas = () => `<div class="cta-row"><a class="btn btn-a">${esc(D.cta)} ${I.arrow}</a>${D.phone ? `<a class="btn btn-o">${I.phone} ${esc(D.phone)}</a>` : (D.cta2 ? `<a class="btn btn-o">${esc(D.cta2)}</a>` : '')}</div>`;
const facts = () => `<div class="facts">${D.facts.map((f) => `<div class="fact">${I[f.icon] || I.star}<div><b>${esc(f.b)}</b><span>${esc(f.s)}</span></div></div>`).join('')}</div>`;
const head = () => `<div class="concept"><b>Concept preview</b> designed by 83 App Studio for ${esc(D.name)} · not the live website</div>`;
const txt = (extra = '') => `<div class="txt"><span class="eyebrow">${esc(D.eyebrow)}</span><h1>${em(D.h1)}</h1><p class="sub">${esc(D.sub)}</p>${ctas()}${extra}</div>`;

const heroes = {
  bold: () => `<div class="head">${nav()}</div><section class="hero">${D.p1 ? `<div class="bg">${ph('', D.p1, D.p1pos)}</div><div class="stripe"></div>` : ''}
     <div class="wrap">${txt(facts())}</div>${D.p1 ? ratingCard() + quoteCard() : ''}</section>`,
  edit: () => `${nav()}<section class="hero"><div class="wrap">${txt(D.loves && D.loves.length ? `<div class="loves"><b>Guests mention</b>${D.loves.map((l) => `<span>${esc(l)}</span>`).join('')}</div>` : facts())}
     <div class="mosaic">${ph('p1', D.p1, D.p1pos)}${ph('p2', D.p2, D.p2pos)}${ratingCard()}${quoteCard()}</div></div></section>`,
  soft: () => `${nav()}<section class="hero"><div class="wrap">${txt(facts())}
     <div class="art">${ph('p1', D.p1, D.p1pos)}${ph('p2', D.p2, D.p2pos)}${ratingCard()}${quoteCard()}</div></div></section>`,
  clean: () => `${nav()}<section class="hero"><div class="wrap">${txt(facts())}
     <div class="art">${D.p1 ? ph('p1', D.p1, D.p1pos) : `<div class="panel"><span class="mono">${esc(D.mono)}</span></div>`}
     ${D.hours_rows.length ? `<div class="card info"><h4>${esc(D.info_title)}</h4>${D.hours_rows.map(([a, b]) => `<div><span>${esc(a)}</span><b>${esc(b)}</b></div>`).join('')}</div>` : ''}${ratingCard()}</div></div></section>`,
  fresh: () => `${nav()}<section class="hero"><div class="wrap">${txt(facts())}
     <div class="art">${ph('p1', D.p1, D.p1pos)}<div class="card form"><h4>${esc(D.form_title)}</h4><p>${esc(D.form_sub)}</p>
       <div class="in">Your name</div><div class="in">Phone number</div><div class="in">${esc(D.services[0] ? D.services[0].b : 'What do you need?')} <span>▾</span></div>
       <a class="btn btn-a">${esc(D.cta_short)} ${I.arrow}</a></div>${ratingCard()}</div></div></section>`,
};

const reviews = () => D.review_cards.length ? `<section class="blk reviews" id="reviews"><div class="wrap">
  <div class="top"><div><span class="eyebrow" style="color:inherit;opacity:.8">Reviews</span><h2>${em(D.reviews_h2)}</h2></div>
  ${D.rating ? `<div class="big">${I.g.replace('class="g"', 'class="g" style="width:46px;height:46px"')}<div><div class="num">${D.rating.toFixed(1)}</div><div class="lbl"><span class="stars">${stars(D.rating)}</span><br>${D.reviews.toLocaleString()} reviews on Google</div></div></div>` : ''}</div>
  <div class="rgrid">${D.review_cards.map((r) => `<div class="rcard"><span class="stars">★★★★★</span><p>“${esc(r.text)}”</p><div class="who"><i>${esc(r.who[0])}</i><div>${esc(r.who)}<small>Google review${r.ago ? ' · ' + esc(r.ago) : ''}</small></div></div></div>`).join('')}</div>
</div></section>` : '';
const services = () => D.services.length ? `<section class="blk"><div class="wrap"><span class="eyebrow">${esc(D.services_eyebrow)}</span><h2>${em(D.services_h2)}</h2>
  <div class="svc">${D.services.slice(0, 6).map((s) => `<div><b>${esc(s.b)}</b><span>${esc(s.s)}</span></div>`).join('')}</div></div></section>` : '';
const footer = () => `<footer><div class="wrap"><div><b>${esc(D.wordmark)}</b><div style="margin-top:8px">${esc(D.address || '')}</div></div><div>${esc(D.phone || '')}</div></div></footer>`;
const mbar = () => `<div class="mbar">${D.phone ? `<a>${I.phone} Call</a>` : ''}<a class="p">${esc(D.cta_short)}</a></div>`;

document.documentElement.style.cssText = Object.entries(D.vars).map(([k, v]) => `--${k}:${v}`).join(';');
document.body.className = 'a-' + D.arch;
document.getElementById('app').innerHTML = head() + heroes[D.arch]() + reviews() + services() + footer() + mbar();
</script>
</body>
</html>
